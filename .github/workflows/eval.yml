# ============================================================
# RAW-EVAH CI — Role-Aware Agent Harness Evaluation
# Runs: Python compile check → provider smoke test → DeepEval suite → Promptfoo eval
#
# Supply-chain hardening:
#   - GitHub Actions pinned to commit SHA (not tag)
#   - pip install from requirements.txt with --no-deps-for-pinned
#   - npm ci with package-lock.json
#   - pull_request_target disallowed
#   - No secrets in eval (deterministic, offline)
# ============================================================

name: Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned to commit SHA for supply-chain integrity
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci || npm install

      # Step 1: Compile check
      - name: Compile check
        run: |
          python -m py_compile promptfoo/multi_agent_provider.py
          python -m py_compile sensors/feedback_sensors.py
          python -m py_compile tests/deepeval/metrics.py
          python -m py_compile tests/deepeval/test_role_boundaries.py

      # Step 2: Provider smoke test
      - name: Provider smoke test
        run: python promptfoo/multi_agent_provider.py

      # Step 3: DeepEval suite
      - name: DeepEval suite
        run: python -m pytest tests/deepeval/ -v

      # Step 4: Promptfoo eval
      - name: Promptfoo eval
        run: npx promptfoo eval -c promptfoo/promptfooconfig.yaml --no-cache
